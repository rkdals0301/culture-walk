<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <filter id="card-shadow" x="-15%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E3A5F" flood-opacity="0.16"/>
    </filter>
    <filter id="marker-shadow" x="-35%" y="-25%" width="170%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#173B73" flood-opacity="0.28"/>
    </filter>
    <filter id="small-shadow" x="-20%" y="-25%" width="145%" height="165%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#234B73" flood-opacity="0.14"/>
    </filter>
    <clipPath id="map-card-clip">
      <rect x="510" y="89" width="640" height="452" rx="28"/>
    </clipPath>
    <pattern id="map-grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" stroke="#E3E7E5" stroke-width="1"/>
    </pattern>
    <!-- Same visual language as the live map marker. -->
    <g id="event-marker">
      <path d="M24 2C14.61 2 7 9.47 7 18.68c0 8.36 4.57 14.07 7.98 18.27l7.47 9.23a2 2 0 0 0 3.1 0l7.47-9.23C36.43 32.75 41 27.04 41 18.68 41 9.47 33.39 2 24 2Z" fill="#3182F6" stroke="#FFFFFF" stroke-width="2" filter="url(#marker-shadow)"/>
      <circle cx="24" cy="18.8" r="8" fill="#FFFFFF"/>
      <circle cx="24" cy="18.8" r="3.6" fill="#3182F6"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#F7F8FA"/>
  <path d="M1055 0h145v150h-145z" fill="#EAF2FF"/>
  <path d="M0 574h280v56H0z" fill="#EEF4FB"/>

  <!-- Brand header -->
  <g transform="translate(56 38)">
    <image href="/assets/images/logo-128.png" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
    <text x="54" y="29" fill="#142033" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="800" letter-spacing="-1">문화산책</text>
  </g>
  <text x="1015" y="63" fill="#728095" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="750" letter-spacing="0.3">전국 문화행사 지도</text>
  <path d="M56 103h1088" stroke="#E3E8EF"/>

  <!-- Editorial message -->
  <g transform="translate(56 158)">
    <rect width="5" height="5" rx="2.5" fill="#3182F6"/>
    <text x="18" y="6" fill="#3182F6" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="800" letter-spacing="1.8">CULTURE WALK</text>
  </g>
  <text x="56" y="247" fill="#142033" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="43" font-weight="800" letter-spacing="-2.2">전국 문화행사를</text>
  <text x="56" y="300" fill="#142033" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="43" font-weight="800" letter-spacing="-2.2">한눈에 만나보세요</text>
  <path d="M56 336h42" stroke="#3182F6" stroke-width="4" stroke-linecap="round"/>
  <text x="56" y="376" fill="#5E6B7B" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="650" letter-spacing="-0.6">축제 · 공연 · 전시 · 체험</text>

  <g transform="translate(56 447)">
    <text fill="#27364A" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="750" letter-spacing="-0.6">가까운 곳의 문화를 찾고</text>
    <text y="28" fill="#27364A" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="750" letter-spacing="-0.6">지도를 따라 산책하세요.</text>
  </g>
  <text x="56" y="584" fill="#8794A5" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13" font-weight="650" letter-spacing="-0.2">culturewalk.gangmin.dev</text>

  <!-- Product map card -->
  <g filter="url(#card-shadow)">
    <rect x="510" y="89" width="640" height="452" rx="28" fill="#FFFFFF"/>
    <g clip-path="url(#map-card-clip)">
      <rect x="510" y="89" width="640" height="452" fill="#F7F6F0"/>
      <rect x="510" y="89" width="640" height="452" fill="url(#map-grid)" opacity="0.58"/>
      <path d="M510 119c82 25 140 28 204 4 77-29 137-22 196 9 70 37 143 31 240-13v160c-86 32-160 34-238 0-72-31-128-29-193 8-67 39-137 40-209 12V119Z" fill="#E7EEE6"/>
      <path d="M1150 384c-72-32-135-38-199-9-73 35-132 41-204 10-79-34-150-30-237 17v139h640V384Z" fill="#E2EFF8"/>
      <path d="M510 434c85-41 160-45 239-11 79 34 143 32 228-7 68-31 126-35 173-19" stroke="#D1E6F6" stroke-width="47" stroke-linecap="round"/>

      <g stroke="#D9DEE2" stroke-linecap="round" fill="none">
        <path d="M510 199h640" stroke-width="14"/>
        <path d="M510 320h640" stroke-width="17"/>
        <path d="M510 477h640" stroke-width="13"/>
        <path d="M624 89v452" stroke-width="14"/>
        <path d="M786 89v452" stroke-width="17"/>
        <path d="M1003 89v452" stroke-width="14"/>
        <path d="M533 133c82 60 151 83 241 76 104-7 187 24 336 102" stroke-width="10"/>
        <path d="M531 508c73-79 137-116 216-116 96 0 154-38 302-143" stroke-width="10"/>
      </g>
      <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
        <path d="M510 199h640" stroke-width="8"/>
        <path d="M510 320h640" stroke-width="10"/>
        <path d="M510 477h640" stroke-width="7"/>
        <path d="M624 89v452" stroke-width="8"/>
        <path d="M786 89v452" stroke-width="10"/>
        <path d="M1003 89v452" stroke-width="8"/>
        <path d="M533 133c82 60 151 83 241 76 104-7 187 24 336 102" stroke-width="4"/>
        <path d="M531 508c73-79 137-116 216-116 96 0 154-38 302-143" stroke-width="4"/>
      </g>

      <g fill="#7A8794" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" letter-spacing="-0.6">
        <text x="562" y="179">광화문</text>
        <text x="718" y="286">세종대로</text>
        <text x="878" y="178">종로구</text>
        <text x="1038" y="384">을지로</text>
        <text x="885" y="516">청계천</text>
      </g>

      <path d="M661 274c52-34 101-40 154-21 42 15 72 14 107-1" stroke="#3182F6" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.74"/>
      <use href="#event-marker" x="636" y="244"/>
      <use href="#event-marker" x="777" y="219"/>
      <use href="#event-marker" x="901" y="239"/>
      <use href="#event-marker" x="721" y="389"/>

      <g transform="translate(538 117)" filter="url(#small-shadow)">
        <rect width="151" height="40" rx="13" fill="#FFFFFF"/>
        <circle cx="22" cy="20" r="7" fill="#3182F6"/>
        <path d="M19 20h6M22 17v6" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
        <text x="40" y="25" fill="#344256" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="750" letter-spacing="-0.4">문화행사 지도</text>
      </g>

      <g transform="translate(930 466)" filter="url(#small-shadow)">
        <rect width="174" height="61" rx="15" fill="#FFFFFF"/>
        <circle cx="21" cy="22" r="4" fill="#3182F6"/>
        <text x="34" y="27" fill="#718096" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" font-weight="700" letter-spacing="-0.3">현재 지도 영역</text>
        <text x="18" y="48" fill="#182230" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="15" font-weight="800" letter-spacing="-0.4">행사 둘러보기</text>
      </g>
    </g>
    <rect x="510.5" y="89.5" width="639" height="451" rx="27.5" stroke="#E3E8EF"/>
  </g>
</svg>
