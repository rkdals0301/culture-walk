<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Toss Premium Azure to Royal Indigo Gradient -->
    <linearGradient id="toss-bg-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Top Specular Rim Sheen -->
    <linearGradient id="toss-rim" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Depth Shadow for Emblem -->
    <filter id="toss-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0E367A" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Superellipse App Icon Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#toss-bg-grad)" />
  <!-- Native Inner Rim -->
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="url(#toss-rim)" stroke-width="4" fill="none" />

  <!-- Unified Culture Walk (문화산책) Emblem -->
  <g filter="url(#toss-shadow)">
    <!-- 1. Dynamic Walk Path / Horizon (산책로) -->
    <path
      d="M 104 388 C 176 348, 336 348, 408 388"
      stroke="#FFFFFF"
      stroke-width="36"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- 2. Location Pin Body (지도 탐색) -->
    <!-- Smooth continuous curve from pin tip up around the head and back down -->
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 256 92
         C 182 92, 122 152, 122 226
         C 122 292, 196 366, 256 422
         C 316 366, 390 292, 390 226
         C 390 152, 330 92, 256 92 Z

         M 256 136
         Q 256 226 346 226
         Q 256 226 256 316
         Q 256 226 166 226
         Q 256 226 256 136 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
