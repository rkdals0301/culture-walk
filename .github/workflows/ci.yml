name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAKAO_MAP_APP_KEY: '00000000000000000000000000000000'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        run: npm run cf:typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check production smoke script
        run: node --check scripts/production-smoke.mjs

      - name: Check Node scripts
        shell: bash
        run: find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Validate migration sequence
        run: npm run db:migrations:check

      - name: Protect applied migration SQL
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run db:migrations:changes

      - name: Build Cloudflare worker
        run: npm run cf:build

      - name: Enforce client bundle budget
        run: npm run bundle:check

      - name: Install CI Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Browser E2E
        run: npm run test:e2e:run

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
